# fly.toml — Passage Watch
# Scale-to-zero: the machine stops when idle and starts on the next request.
# Fly's proxy holds the request while the machine boots, so the browser gets the
# page instead of a 5xx. Cold starts are a few seconds; index.html shows a
# loading state while that happens.
app = "passage-watch"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 30

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[healthchecks]]
  method = "GET"
  path = "/health"
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
