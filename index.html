<!doctype html>
<html lang="en" style="color-scheme:dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060A0D" />
    <meta name="description" content="Passage Watch — choose what your tokenized holding becomes, and know when the route is ready." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/JetBrainsMono-ExtraBold.woff2" as="font" type="font/woff2" crossorigin />
    <title>Passage Watch</title>
  </head>
  <body>
    <div id="root">
      <div id="boot" style="font-family:ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace;background:#060A0D;color:#D6E1E8;min-height:100vh;display:flex;align-items:center;justify-content:center;">
        <div style="max-width:520px;padding:24px;">
          <div style="font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#3CE081;font-weight:700;">PASSAGE WATCH<span style="animation:pw-blink 1.1s steps(1) infinite;">&#9612;</span></div>
          <div style="font-size:18px;font-weight:700;letter-spacing:.02em;margin-top:14px;">CHOOSE WHAT YOUR TOKENIZED HOLDING BECOMES.</div>
          <div style="font-size:12px;color:#7C8D9B;margin-top:10px;" id="boot-msg">&gt; starting the read-only workspace&#8230;</div>
          <div style="height:6px;background:#121B23;border:1px solid #1B2836;margin-top:18px;overflow:hidden;">
            <div style="height:100%;width:40%;background:#3CE081;animation:pw-slide 1.2s ease-in-out infinite;"></div>
          </div>
          <div style="font-size:11px;color:#6B8296;margin-top:12px;">cold start can take a few seconds &#8212; the machine is waking up.</div>
        </div>
      </div>
      <style>@keyframes pw-slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}@keyframes pw-blink{50%{opacity:0}}</style>
    </div>
    <script>
      window.__pwBoot = setTimeout(function () {
        var m = document.getElementById('boot-msg');
        if (m) m.textContent = '> waking the service — cold starts can take a few seconds.';
      }, 2500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
