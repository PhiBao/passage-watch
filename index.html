<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F4EE" />
    <meta name="description" content="Passage Watch — choose what your tokenized holding becomes, and know when the route is ready." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Passage Watch</title>
  </head>
  <body>
    <div id="root">
      <div id="boot" style="font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#F6F4EE;color:#172B2A;min-height:100vh;display:flex;align-items:center;justify-content:center;">
        <div style="max-width:420px;padding:24px;text-align:center;">
          <div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#176B5B;font-weight:700;margin-bottom:10px;">Passage Watch</div>
          <div style="font-size:20px;font-weight:700;letter-spacing:-.02em;">Choose what your tokenized holding becomes.</div>
          <div style="font-size:13px;color:#63706C;margin-top:10px;" id="boot-msg">Starting the read-only workspace…</div>
          <div style="height:3px;background:#D8DDD5;border-radius:2px;margin-top:18px;overflow:hidden;">
            <div style="height:100%;width:40%;background:#176B5B;border-radius:2px;animation:pw-slide 1.2s ease-in-out infinite;"></div>
          </div>
          <div style="font-size:11px;color:#63706C;margin-top:12px;">Cold starts can take a few seconds — thank you for waiting.</div>
        </div>
      </div>
      <style>@keyframes pw-slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}</style>
    </div>
    <script>
      window.__pwBoot = setTimeout(function () {
        var m = document.getElementById('boot-msg');
        if (m) m.textContent = 'Waking the service — this can take a few seconds on a cold start.';
      }, 2500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
